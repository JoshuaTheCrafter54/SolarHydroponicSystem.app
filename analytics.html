<body>
<!-- ═══════════════ MAIN CONTENT ═══════════════ -->
  <div class="main">
    <div class="dashboard-wrapper">
 
      <div class="dashboard-title">Data Log Dashboard</div>
 
      <div class="chart-grid">
 
        <!-- Temperature History -->
        <div class="chart-card">
          <div class="chart-card-title">Temperature History</div>
          <div class="chart-canvas-wrap">
            <canvas id="chartTemp"></canvas>
          </div>
        </div>
 
        <!-- Humidity History -->
        <div class="chart-card">
          <div class="chart-card-title">Humidity History</div>
          <div class="chart-canvas-wrap">
            <canvas id="chartHumid"></canvas>
          </div>
        </div>
 
        <!-- Water Level History -->
        <div class="chart-card">
          <div class="chart-card-title">Water Level History</div>
          <div class="chart-canvas-wrap">
            <canvas id="chartWater"></canvas>
          </div>
        </div>
 
        <!-- Light History -->
        <div class="chart-card">
          <div class="chart-card-title">Light History</div>
          <div class="chart-canvas-wrap">
            <canvas id="chartLight"></canvas>
          </div>
        </div>
 
      </div><!-- /chart-grid -->
    </div><!-- /dashboard-wrapper -->
  </div><!-- /main-content -->
</body>
